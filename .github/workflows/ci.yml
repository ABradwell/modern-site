name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deliberately before the build. `next lint` was removed in Next 16 and
      # `next build` no longer lints, so without this step lint and type errors
      # would reach main with a green tick.
      - run: pnpm verify

      - run: node scripts/check-contrast.mjs

      # Regenerate the terrain and fail if it differs from what is committed.
      # The generator is deterministic, so any diff means the committed asset is
      # stale relative to its source.
      - run: pnpm terrain
      - run: git diff --exit-code src/content/terrain.generated.ts

      - run: pnpm build

  # The pre-push hook doing this same check lives in the working tree, so it can
  # be skipped with --no-verify. This job is the copy that cannot be, and it is a
  # required check on main. Kept separate from `verify` so it stays fast and does
  # not depend on an install succeeding. See "Commit identity" in the README.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is authored by the repository owner
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A brand new branch, or a force push, reports a base that is not a
          # commit. There is no range to walk in that case, so check the tip.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            sh scripts/git-identity-guard.sh range "$BASE..$HEAD_SHA"
          else
            sh scripts/git-identity-guard.sh range -1 "$HEAD_SHA"
          fi
