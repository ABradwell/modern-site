# DigitalOcean App Platform spec.
#
# This file is the source of truth for the app's configuration. App Platform
# does NOT read it automatically on push: it is applied with doctl, and the
# dashboard's own spec editor is downstream of it.
#
#   doctl apps create --spec .do/app.yaml            # first time
#   doctl apps update <app-id> --spec .do/app.yaml   # thereafter
#   doctl apps list                                  # to find <app-id>
#
# Once the app exists, `deploy_on_push` below means ordinary commits to main
# deploy on their own. doctl is only needed when this file changes.
#
# Anything edited in the dashboard instead of here is drift, and the next
# `doctl apps update` reverts it. Change it here.

name: aidenbradwell-site
region: lon

static_sites:
  - name: site

    github:
      repo: ABradwell/modern-site
      branch: main
      deploy_on_push: true

    # The Node buildpack. It picks the Node version from `engines.node` in
    # package.json, and pnpm from the presence of pnpm-lock.yaml plus the
    # `packageManager` field, which it honours through corepack.
    environment_slug: node-js

    build_command: pnpm build

    # `next build` with `output: 'export'` writes here. The post-build gate in
    # scripts/verify-export.mjs runs as part of `pnpm build` and fails the
    # deploy if a required artefact is missing.
    output_dir: out

    index_document: index.html

    # The stylised 404 from src/app/not-found.tsx. Mutually exclusive with
    # catchall_document, and this is deliberately the one we want: a catchall
    # would serve the homepage with a 200 for every mistyped URL, so broken
    # links would look fine to a visitor and to a crawler.
    error_document: 404.html

ingress:
  rules:
    - component:
        name: site
      match:
        path:
          prefix: /

# Custom domain. Commented out because adding it here starts certificate
# issuance and expects DNS to be pointing at the app already. Uncomment once
# the domain's nameservers or its ALIAS/CNAME record resolve to DigitalOcean.
#
# domains:
#   - domain: aidenbradwell.com
#     type: PRIMARY
#     zone: aidenbradwell.com
#   - domain: www.aidenbradwell.com
#     type: ALIAS
#     zone: aidenbradwell.com
